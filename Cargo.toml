[package]
name = "termos"
version = "0.2.0"
edition = "2024"

[dependencies]
crossterm = "0.28.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
directories = "5.0"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
keyring = "4.2"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
rmcp = { version = "3.5.1", features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }

